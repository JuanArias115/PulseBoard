name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: juanarias115
  API_IMAGE: pulseboard-api
  WEB_IMAGE: pulseboard-web
  REMOTE_PATH: /opt/pulseboard

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:latest

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pulseboard_deploy
          chmod 600 ~/.ssh/pulseboard_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/pulseboard_deploy -P "$DEPLOY_PORT" docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/pulseboard-docker-compose.prod.yml"

      - name: Restart PulseBoard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          ssh -i ~/.ssh/pulseboard_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' GHCR_USERNAME='$GHCR_USERNAME' GHCR_READ_TOKEN='$GHCR_READ_TOKEN' bash -s" <<'EOSSH'
          set -euo pipefail

          mkdir -p /opt/pulseboard
          cp /tmp/pulseboard-docker-compose.prod.yml /opt/pulseboard/docker-compose.prod.yml
          cd /opt/pulseboard

          if [ ! -f .env ]; then
            echo "/opt/pulseboard/.env is missing. Create it from .env.example before deploying." >&2
            exit 1
          fi

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            printf '%s\n' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          fi

          export IMAGE_TAG
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f

          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18081/health
          EOSSH
